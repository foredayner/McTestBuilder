name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          # Compiler errors and Gradle's summary as one annotation (readable through the API).
          grep -E "error:|warning: \[removal\]|What went wrong|Could not|> " -A2 build.log | head -150 > errors.txt || true
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=build errors::${msg}"
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-ai-build-assistant-mc1.21.4
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
